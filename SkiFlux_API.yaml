          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/SuspendedUser'
          readOnly: true
        suspended_by:
          allOf:
          - $ref: '#/components/schemas/SuspendedBy'
          readOnly: true
        suspended_by_label:
          type: string
          readOnly: true
        source:
          $ref: '#/components/schemas/UserSuspensionSourceEnum'
        reason:
          type: string
          maxLength: 255
        duration_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Number of days. Null means permanent / until further notice.
        display_duration:
          type: string
          readOnly: true
        is_permanent:
          type: boolean
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Null means permanent.
        status:
          $ref: '#/components/schemas/UserSuspensionStatusEnum'
        lifted_by:
          type: string
          format: uuid
          nullable: true
        lifted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - display_duration
      - id
      - is_permanent
      - reason
      - suspended_by
      - suspended_by_label
      - user
    UserSuspensionSourceEnum:
      enum:
      - admin
      - ai
      type: string
      description: |-
        * `admin` - Admin
        * `ai` - Moderator (Auto)
    UserSuspensionStatusEnum:
      enum:
      - active
      - lifted
      - expired
      type: string
      description: |-
        * `active` - Active
        * `lifted` - Lifted
        * `expired` - Expired
    UserWallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        bonus_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Non-withdrawable registration bonus balance.
        withdrawable_balance:
          type: number
          format: double
          readOnly: true
        is_locked:
          type: boolean
          description: If True, all transaction activities (credits/debits) are blocked.
        is_platform_wallet:
          type: boolean
          description: True for the singleton platform revenue wallet.
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - updated_at
      - withdrawable_balance
    UserWalletRequest:
      type: object
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        bonus_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Non-withdrawable registration bonus balance.
        is_locked:
          type: boolean
          description: If True, all transaction activities (credits/debits) are blocked.
        is_platform_wallet:
          type: boolean
          description: True for the singleton platform revenue wallet.
    VerificationModeEnum:
      enum:
      - automatic
      - manual
      type: string
      description: |-
        * `automatic` - Automatic
        * `manual` - Manual Submit + Claim
    VerifyEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        otp:
          type: string
          minLength: 6
          maxLength: 6
      required:
      - email
      - otp
    VerifyForgotPasswordCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        otp:
          type: string
          writeOnly: true
          minLength: 6
          maxLength: 6
      required:
      - email
      - otp
    VerifyIntegrityRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    VerifyPaymentRequest:
      type: object
      properties:
        tx_ref:
          type: string
          minLength: 1
        gateway_reference:
          type: string
      required:
      - tx_ref
    WalletAudit:
      type: object
      description: Detailed audit view mapping transaction records to users and executing
        admins.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        user_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Positive for credits, negative for debits
        transaction_type:
          $ref: '#/components/schemas/SkillcoinTransactionTypeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/SkillcoinTransactionStatusEnum'
          description: |-
            Lifecycle state for audit; posted rows count toward wallet balance.

            * `posted` - Posted
            * `pending` - Pending
            * `cancelled` - Cancelled
            * `refunded` - Refunded
            * `failed` - Failed
        description:
          type: string
          maxLength: 255
        reference_id:
          type: string
          format: uuid
          nullable: true
          description: ID of EpisodePurchase, TaskSubmission, etc.
        admin_email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admin_email
      - amount
      - created_at
      - description
      - id
      - transaction_type
      - user_email
      - user_name
    WalletFinancialSummary:
      type: object
      description: Serializer for the user's total earned, spent, and withdrawn stats.
      properties:
        total_earned:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total_spent:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total_withdrawn:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - total_earned
      - total_spent
      - total_withdrawn
    WatchHistoryItem:
      type: object
      properties:
        episode:
          allOf:
          - $ref: '#/components/schemas/Episode'
          readOnly: true
        watch_duration_seconds:
          type: integer
        completed:
          type: boolean
        viewed_at:
          type: string
          format: date-time
      required:
