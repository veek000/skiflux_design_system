openapi: 3.0.3
info:
  title: SkiFlux API
  version: 1.0.0
  description: Backend API documentation and testing for SkiFlux. Successful learner
    responses use envelope {status, status_code, message, data}; documented 200 schemas
    describe the `data` payload unless noted otherwise.
paths:
  /api/v1/admin/activities:
    get:
      operationId: v1_admin_activities_retrieve
      description: Returns a paginated list of recent platform activity logs.
      summary: List Admin Activities
      parameters:
      - in: query
        name: action_type
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - Admin › Dashboard
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
          description: ''
  /api/v1/admin/activities/recent:
    get:
      operationId: v1_admin_activities_recent_retrieve
      description: Returns recent activity logs for the overview dashboard widget.
      summary: Get Recent Admin Activities
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Number of activities to return (default: 10, max: 50).'
      tags:
      - Admin › Dashboard
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityLog'
          description: ''
  /api/v1/admin/activities/stats:
    get:
      operationId: v1_admin_activities_stats_retrieve
      summary: Get Admin Activity Stats
      tags:
      - Admin › Dashboard
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityStats'
          description: ''
  /api/v1/admin/auth/change-password:
    post:
      operationId: v1_admin_auth_change_password_create
      description: Change the current admin user's password.Requires current password
        verification.
      summary: Admin Change Password
      tags:
      - Admin › Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
        required: true
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Password changed successfully.
  /api/v1/admin/auth/forgot-password:
    post:
      operationId: v1_admin_auth_forgot_password_create
      description: Send a reset OTP to an admin email if the admin exists.
      summary: Admin Forgot Password
      tags:
      - Admin › Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminForgotPasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminForgotPasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminForgotPasswordRequestRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Sends a reset code to admin email if the email exists.
  /api/v1/admin/auth/login:
    post:
      operationId: v1_admin_auth_login_create
      description: Authenticate an admin user.Returns access and refresh tokens.
      summary: Admin Login
      tags:
      - Admin › Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Login successful.
  /api/v1/admin/auth/logout:
    post:
      operationId: v1_admin_auth_logout_create
      description: Blacklist the admin refresh token, ending the session.
      summary: Admin Logout
      tags:
      - Admin › Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminLogoutRequest'
        required: true
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully.
  /api/v1/admin/auth/reset-password:
    post:
      operationId: v1_admin_auth_reset_password_create
      description: Verify OTP and reset an admin password.
      summary: Admin Reset Password
      tags:
      - Admin › Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordConfirmRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Password has been reset successfully.
  /api/v1/admin/auth/token/refresh:
    post:
      operationId: v1_admin_auth_token_refresh_create
      description: Exchange a valid admin refresh token for a new access token.
      summary: Admin Token Refresh
      tags:
      - Admin › Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminRefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminRefreshTokenRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Returns new access_token.
  /api/v1/admin/auth/verify-forgot-password-otp:
    post:
      operationId: v1_admin_auth_verify_forgot_password_otp_create
      description: Verifies the 6-digit OTP sent during admin forgot password.
      summary: Verify Admin Password OTP
      tags:
      - Admin › Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVerifyForgotPasswordCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminVerifyForgotPasswordCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminVerifyForgotPasswordCodeRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Password OTP verified successfully.
  /api/v1/admin/content/approval/list:
    get:
      operationId: v1_admin_content_approval_list_retrieve
      description: Paginated list of episodes for content approval, filterable by
        status (awaiting_review, approved, rejected).
      summary: Content Approval List
      parameters:
      - in: query
        name: skillworld
        schema:
          type: string
        description: Optional filter by skillworld (e.g. 'web_development').
      - in: query
        name: status
        schema:
          type: string
        description: 'Optional Filter status: awaiting_review, approved, rejected'
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Paginated content approval list.
  /api/v1/admin/content/approval/stats:
    get:
      operationId: v1_admin_content_approval_stats_retrieve
      description: 'Returns statistics for the content approval dashboard: pending
        count, approved today, rejected today, and average review time.'
      summary: Content Approval Stats
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Content approval stats.
  /api/v1/admin/content/distribution/overview:
    get:
      operationId: admin_content_distribution_overview
      description: Returns an overview of content distribution across the platform,
        including total episode count, project-based task count, and assessment-based
        task count. Admin-only endpoint.
      summary: Get Content Distribution Overview
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewContentDistribution'
          description: Content distribution overview retrieved successfully.
  /api/v1/admin/content/episodes/{episode_id}:
    get:
      operationId: v1_admin_content_episodes_retrieve
      description: Fetch an episode with tasks, submissions and comments for review.
      summary: Get Episode Review Detail
      parameters:
      - in: path
        name: episode_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Episode review detail with episode, tasks, submissions, comments.
  /api/v1/admin/content/episodes/{episode_id}/review:
    post:
      operationId: v1_admin_content_episodes_review_create
      description: Approve or reject an episode that is in REVIEW status. An approval
        publishes the episode immediately. A rejection requires a reason, which is
        stored on the episode and emailed to the creator.
      summary: Review Episode (Approve or Reject)
      parameters:
      - in: path
        name: episode_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeReviewActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EpisodeReviewActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EpisodeReviewActionRequest'
        required: true
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Review decision recorded.
  /api/v1/admin/content/episodes/bulk-review:
    post:
      operationId: v1_admin_content_episodes_bulk_review_create
      description: Approve or reject multiple episodes at once. Only episodes in REVIEW
        status are processed; others are skipped.
      summary: Bulk Review Episodes
      tags:
      - Admin › Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkEpisodeReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkEpisodeReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkEpisodeReviewRequest'
        required: true
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Bulk review processed.
  /api/v1/admin/content/episodes/review:
    get:
      operationId: v1_admin_content_episodes_review_retrieve
      description: Returns a paginated and serialized list of all episodes currently
        in REVIEW status, waiting for admin approval.
      summary: List Episodes Under Review
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EpisodeReviewList'
          description: Paginated list of episodes under review.
  /api/v1/admin/content/episodes/verification/queue:
    get:
      operationId: v1_admin_content_episodes_verification_queue_retrieve
      description: Paginated list of episodes pending review, filterable by priority.
      summary: Verification Queue
      parameters:
      - in: query
        name: creator_id
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          enum:
          - oldest
          - newest
          type: string
          default: oldest
          minLength: 1
        description: |-
          * `oldest` - oldest
          * `newest` - newest
      - in: query
        name: page
        schema:
          type: string
          minLength: 1
      - in: query
        name: priority
        schema:
          enum:
          - low
          - medium
          - high
          type: string
          minLength: 1
        description: |-
          * `low` - low
          * `medium` - medium
          * `high` - high
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Paginated verification queue.
  /api/v1/admin/content/episodes/verification/stats:
    get:
      operationId: v1_admin_content_episodes_verification_stats_retrieve
      description: Returns live stats for the verification page — pending count, SLA
        breaches, avg wait and response time for the requesting admin.
      summary: Verification Stats
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Verification stats.
  /api/v1/admin/content/seasons/{season_id}/comments:
    get:
      operationId: v1_admin_content_seasons_comments_retrieve
      description: Get all comments in a season for review.
      summary: Get comments in a season
      parameters:
      - in: path
        name: season_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeCommentList'
          description: ''
  /api/v1/admin/content/seasons/{season_id}/episodes:
    get:
      operationId: v1_admin_content_seasons_episodes_retrieve
      description: Get paginated episodes in a season for admin view
      summary: Get episodes in a season for admin view
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number for pagination
      - in: path
        name: season_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Episodes in the season
  /api/v1/admin/content/seasons/{season_id}/stats:
    get:
      operationId: v1_admin_content_seasons_stats_retrieve
      description: Get season stats based on the season id
      summary: Get season stats based on the season id
      parameters:
      - in: path
        name: season_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Season stats
  /api/v1/admin/content/seasons/{season_id}/tasks:
    get:
      operationId: v1_admin_content_seasons_tasks_retrieve
      description: Get all tasks in a season for review.
      summary: Get tasks in a season
      parameters:
      - in: path
        name: season_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonTaskList'
          description: ''
  /api/v1/admin/content/submissions/{submission_id}:
    get:
      operationId: v1_admin_content_submissions_retrieve
      description: Fetch a task submission with task, episode, season and user details.
      summary: Get Task Submission For Review
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Content
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionDetail'
          description: ''
  /api/v1/admin/content/submissions/{submission_id}/approve:
    post:
      operationId: v1_admin_content_submissions_approve_create
      description: Approve a task submission and award Skillcoin cashback to the user.
      summary: Approve Task Submission
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveTaskSubmissionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApproveTaskSubmissionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApproveTaskSubmissionRequest'
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Submission approved.
  /api/v1/admin/content/submissions/{submission_id}/reject:
    post:
      operationId: v1_admin_content_submissions_reject_create
      description: Reject a task submission with a reason and optional feedback.
      summary: Reject Task Submission
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTaskSubmissionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RejectTaskSubmissionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RejectTaskSubmissionRequest'
        required: true
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionDetail'
          description: ''
  /api/v1/admin/creator/profile/completion_status:
    get:
      operationId: studio_profile_completion
      description: Returns whether the creator's profile is complete. Frontend should
        call this before any studio action and redirect to profile setup if is_complete
        is false.
      summary: Get Creator Profile Completion Status
      tags:
      - Admin › Creator Profile
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorProfileCompletion'
          description: Profile completion status.
  /api/v1/admin/creators/:
    get:
      operationId: v1_admin_creators_list
      description: Admin endpoint to retrieve a paginatedlist of all creators on the
        platform.
      summary: List all Creators
      tags:
      - Admin › Creator Management
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreatorList'
          description: ''
  /api/v1/admin/creators/{creator_id}/analytics/audience-distribution:
    get:
      operationId: admin_creator_audience_distribution
      description: Return the audience distribution for a specific creator, showing
        the percentage of the audience from different countries. Admin-only endpoint.
      summary: Get Creator Audience
      parameters:
      - in: path
        name: creator_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Number of audience entries to return (default: 10, max: 100).'
      tags:
      - Admin › Creator Management
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudienceDistribution'
          description: Creator audience distribution retrieved successfully.
  /api/v1/admin/creators/{creator_id}/analytics/revenue/:
    get:
      operationId: admin_creator_revenue_growth
      description: Return the revenue growth for a specific creator, showing current
        and previous period comparisons. Admin-only endpoint.Labels only include periods
        where at least one purchase occurred in either the current or previous period.
        Missing periods had zero revenue.
      summary: Get Creator Revenue Growth
      parameters:
      - in: path
        name: creator_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: period
        schema:
          type: string
          enum:
          - month
          - week
          - year
        description: 'Time period for revenue data. One of: week, month, year (default:
          week).'
      tags:
      - Admin › Creator Management
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueGrowth'
          description: Creator revenue growth retrieved successfully.
  /api/v1/admin/creators/{creator_id}/analytics/seasons-performance/:
    get:
      operationId: admin_creator_season_performance
      description: Returns paginated season-level performance metrics for a creator
        including sales, completion rate, revenue and rating. Admin-only endpoint.
      summary: Get Creator Season Performance
      parameters:
      - in: path
        name: creator_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Creator Management
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeasonPerformance'
          description: Creator season performance retrieved successfully.
  /api/v1/admin/creators/{id}/analytics/:
    get:
      operationId: v1_admin_creators_analytics_retrieve
      description: Admin endpoint to fetch creator analytics.
      summary: Get Creator Analytics
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Creator Management
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorAnalyticsResponse'
          description: ''
  /api/v1/admin/creators/{id}/episodes/:
    get:
      operationId: v1_admin_creators_episodes_list
      description: Returns paginated episodes for a creator.Optionally filter by status
      summary: Get Creator Episodes
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: status
        schema:
          enum:
          - draft
          - published
          type: string
          minLength: 1
        description: |-
          Filter episodes by status (optional).

          * `draft` - draft
          * `published` - published
      tags:
      - Admin › Creator Management
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreatorEpisode'
          description: ''
  /api/v1/admin/creators/{id}/override/:
    patch:
      operationId: v1_admin_creators_override_partial_update
      description: Admin endpoint to forcefully perform actions on a creator's episode
        (e.g., unpublish).
      summary: Override Creator Episode
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Creator Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOverrideEpisodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOverrideEpisodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOverrideEpisodeRequestRequest'
      security:
      - adminBearerAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/creators/{id}/oversight/:
    get:
      operationId: v1_admin_creators_oversight_retrieve
      description: Admin endpoint to fetch high-leveloversight data (like episode
        count) for a specific creator.
      summary: Get Creator Oversight
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin › Creator Management
      security:
      - adminBearerAuth: []
