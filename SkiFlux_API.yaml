        limit:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/WatchedEpisodeTaskItem'
      required:
      - limit
      - offset
      - results
      - total_count
    WithdrawalAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        destination_type:
          $ref: '#/components/schemas/DestinationTypeEnum'
        gateway_name:
          type: string
          description: Gateway used to register or pay out to this destination (e.g.
            paystack, stripe).
          maxLength: 30
        display_name:
          type: string
          readOnly: true
        bank_code:
          type: string
          maxLength: 10
        bank_name:
          type: string
          maxLength: 100
        account_number:
          type: string
          maxLength: 20
        account_name:
          type: string
          description: Name returned by bank verification API
          maxLength: 255
        status:
          $ref: '#/components/schemas/WithdrawalAccountStatusEnum'
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_name
      - created_at
      - display_name
      - id
    WithdrawalAccountCreateRequest:
      type: object
      properties:
        bank_code:
          type: string
          minLength: 1
        account_number:
          type: string
          minLength: 1
        gateway_name:
          type: string
          minLength: 1
        bank_name:
          type: string
          description: Optional display name from the banks list. If omitted, the
            backend resolves it from the gateway by bank_code.
      required:
      - account_number
      - bank_code
      - gateway_name
    WithdrawalAccountStatusEnum:
      enum:
      - pending
      - verified
      - rejected
      type: string
      description: |-
        * `pending` - Pending Verification
        * `verified` - Verified
        * `rejected` - Rejected
    WithdrawalRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        net_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/WithdrawalRequestStatusEnum'
        gateway_name:
          type: string
          nullable: true
          description: Gateway used to process this withdrawal
          maxLength: 30
        failure_reason:
          type: string
          nullable: true
        processed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        account:
          allOf:
          - $ref: '#/components/schemas/WithdrawalAccount'
          readOnly: true
      required:
      - account
      - amount
      - created_at
      - id
      - net_amount
    WithdrawalRequestCreateRequest:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - account_id
      - amount
    WithdrawalRequestStatusEnum:
      enum:
      - pending
      - processing
      - completed
      - failed
      - cancelled
      - rejected
      type: string
      description: |-
        * `pending` - Pending Processing
        * `processing` - Processing
        * `completed` - Completed
        * `failed` - Failed
        * `cancelled` - Cancelled
        * `rejected` - Rejected
