name: Build Release APK

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Optional: Also run when you push a version tag (e.g., v1.0.0)
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Inject real Firebase options
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          # If the secret is missing (e.g. not set up yet), we fallback to the stub
          # so the build doesn't fail, but it won't have real FCM.
          if [ -z "$FIREBASE_OPTIONS" ]; then
            echo "Warning: FIREBASE_OPTIONS_DART secret is not set. Using CI stub."
            cp skiflux_mobile_app_v2/lib/firebase_options_ci_stub.dart skiflux_mobile_app_v2/lib/firebase_options.dart
          else
            echo "Injecting real Firebase options from secret..."
            echo "$FIREBASE_OPTIONS" > skiflux_mobile_app_v2/lib/firebase_options.dart
          fi

      - name: pub get (design system)
        working-directory: skiflux_design_system
        run: flutter pub get

      - name: pub get (mobile app)
        working-directory: skiflux_mobile_app_v2
        run: flutter pub get

      - name: Build Release APK
        working-directory: skiflux_mobile_app_v2
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skiflux-release-apk
          path: skiflux_mobile_app_v2/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
