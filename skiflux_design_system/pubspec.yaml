name: skiflux_design_system
description: Skiflux Flutter design system extracted from Figma (file 863bu2TwQqgzIRgPD8bXkG, Design System page 107:6437).
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Icon system matching Figma Remix Icons library.
  # https://github.com/Remix-Design/RemixIcon
  remixicon: ^4.9.3
  # Real audio recording (ComposeBar) + playback (Comment voicenotes).
  audio_waveforms: ^1.3.0
  # App-documents path for recorded voice notes.
  path_provider: ^2.1.4
  # Vector assets (streak flame, laurels, light rays) — confirmed per
  # CLAUDE.md package policy.
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Standalone glyphs missing from the remixicon font (e.g. search-x-fill,
    # exported from Figma 2374:11928 for the search empty state).
    - assets/images/

  fonts:
    # Creato Display — local pack from C:\Users\timmy\Downloads\creato_display
    # Figma variable: Font Family/Creato Display
    - family: Creato Display
      fonts:
        - asset: assets/fonts/CreatoDisplay-Thin.otf
          weight: 100
        - asset: assets/fonts/CreatoDisplay-ThinItalic.otf
          weight: 100
          style: italic
        - asset: assets/fonts/CreatoDisplay-Light.otf
          weight: 300
        - asset: assets/fonts/CreatoDisplay-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/CreatoDisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/CreatoDisplay-RegularItalic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/CreatoDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/CreatoDisplay-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/CreatoDisplay-Bold.otf
          weight: 700
        - asset: assets/fonts/CreatoDisplay-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/CreatoDisplay-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/CreatoDisplay-ExtraBoldItalic.otf
          weight: 800
          style: italic
        - asset: assets/fonts/CreatoDisplay-Black.otf
          weight: 900
        - asset: assets/fonts/CreatoDisplay-BlackItalic.otf
          weight: 900
          style: italic

    # DM Sans — Google Fonts (variable opsz+wght)
    # Figma variable: Font Family/DM Sans
    # Source: https://github.com/google/fonts/tree/main/ofl/dmsans
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
        - asset: assets/fonts/DMSans-Italic-Variable.ttf
          style: italic

    # DM Mono — Google Fonts (static)
    # Figma variable: Font Family/DM Mono
    # Source: https://github.com/google/fonts/tree/main/ofl/dmmono
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
